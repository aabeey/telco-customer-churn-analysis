
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telco Customer Churn Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #dashboard-wrapper {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #dashboard-scale {
            width: 1600px;
            height: 900px;
            transform-origin: top left;
        }

        #viz1795540694825 {
            width: 1600px;
            height: 900px;
            position: relative;
        }
    </style>
</head>

<body>

    <div id="dashboard-wrapper">
        <div id="dashboard-scale">

            <div class="tableauPlaceholder" id="viz1795540694825">
                <object class="tableauViz" style="display:none;">
                    <param name="host_url" value="https://public.tableau.com/" />
                    <param name="embed_code_version" value="3" />
                    <param name="site_root" value="" />
                    <param name="name" value="TelcoCustomerChurnDashboard_17953713607360/TelcoCustomerChurnDashboard" />
                    <param name="tabs" value="no" />
                    <param name="toolbar" value="yes" />
                    <param name="language" value="en-US" />
                </object>
            </div>

        </div>
    </div>

    <script>
        const dashboard = document.getElementById("dashboard-scale");

        function fitDashboard() {
            const scaleX = window.innerWidth / 1600;
            const scaleY = window.innerHeight / 900;

            const scale = Math.min(scaleX, scaleY);

            const scaledWidth = 1600 * scale;
            const left = (window.innerWidth - scaledWidth) / 2;

            dashboard.style.transform = `translateX(${left}px) scale(${scale})`;
        }

        window.addEventListener("resize", fitDashboard);
        fitDashboard();

        const divElement = document.getElementById("viz1795540694825");
        const vizElement = divElement.getElementsByTagName("object")[0];

        vizElement.style.width = "1600px";
        vizElement.style.height = "900px";

        const scriptElement = document.createElement("script");
        scriptElement.src = "https://public.tableau.com/javascripts/api/viz_v1.js";

        vizElement.parentNode.insertBefore(scriptElement, vizElement);
    </script>

</body>
</html>
